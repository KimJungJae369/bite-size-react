<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React App 구동 원리</title>
</head>
<body>

    <!-- 
        1. React App 구동 원리
        - npm run dev : React를 가동 시키는 명령어

        <localhost:5173 = 리액트 주소>
        localhost = 내(우리) 컴퓨터 주소, 컴퓨터에서 웹서버를 구동시키면 내 컴퓨터가 웹서버가 된다, 자기 자신의 컴퓨터 가리키는 주소
        5173 = 포트번호 : 컴퓨터에서 프로그램을 구분하는 번호

        <포트번호가 필요한 이유>
        1) React서버와 PHP서버를 두 개의 서버를 동시에 동작하면 두 서버가 같은 포트번호를 사용하면 충돌이 발생한다
        ex) 
            리액트 포트번호 : 5173 = localhost:5173
            PHP 포트번호 : 3344 = localhost:3344
    -->
    
</body>
</html>
