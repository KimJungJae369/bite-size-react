<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React란?</title>
</head>
<body>

    <!-- 
        React란?
        = 자바스크립트의 라이브 러리
        = 대규모 웹 서비스(넷플, 인스타 등등)의  UI를 더 편하게 개발하기 위해 만들어진 기술
        
        <리액트 핵심>
        1. 컴포넌트 기반으로  UI를 표현한다
        = 컴포넌트  = 구성요소 : 화면을 구성(UI) 요소
        ex)
            Header => Header.js(Header컴포넌트)
            Main =>  Main,js(Main 컴포넌트)
            Footer => Footer.js (Footer 컴포넌트)
        = 레고를 조립하듯이 여러 컴포넌트를 조합해서 웹페이지를 만드는 것
            마크업 : UI를 구현
        = Header.js 컴포넌트를 하나 만들면 여러 페이지에 불러와서 사용할 수 있어 중복 코드를 사용하지 않고 유지보수에 좋다



        2. 화면 업데이트 구현이 쉽다
        = 업데이트 : 버튼을 클릭했을 때 버튼의 모양이 변환하는 것 즉 사용자의 행동(클릭, 드래그 등)에 따라 웹페이지가 스스로 자신의 모습을 바꿔 사용
        = 리액트는 '선언형 방식 : 업데이트가 편하다'
            [선언형 방식]
            - 불필요한 과정은 생략하고 내가 이루고자 하는 목적만 간결하게 명시
            -코드가 깔끔하고 짧다
                ex) 식당에가서 '토마토 파스타 하나 주세요'라는 목적만 말하면 된다 과정은 필요 없다
            - 업데이트를 위한 복잡한 동작을 직접 정의할 필요 없이 특정 변수의 값을 바꾸는 것 만으로도 화면을 업데이트 시킬 수 있다

            [명령형 프로그래밍]
            - 목적을 이루기 위한 모든 일련의 과정을 자세하게 설명해야 한다
            - 코드가 복잡하고 길다
                ex) 식장에서 '주방으로 가서 면 100g을 꺼내고 뜨거운 물에 9분간 삶고 그런 다음 후라이팬을 꺼내 불을 올리고 토마토 소스와 함께 볶으세요'라는 아주 자세한 설명
        = 리액트는 컴포넌트 단위로 구성하여 각가의 컴포넌트에 "State"라는 컴포넌트 상태의 특수한 변수를 사용해 State 값이 바뀌면 각각에 적용된 State값이 각각 다른 UI 화면에 렌더링한다
            렌더링 : 웹페이지 화면에 UI요소를 그려내는 것




        3. 화면 업데이트가 빠르게 처리된다
        = 화면 업데이트를 쉽게 구현할 수 있으면서 동시에 빠르게도 처리해 준다

        [브라우저의 렌더링 과정 : Critical Reander Path]
        HTML -> DOM : (HTML코드를 브라우저가 이해하기 쉽게 쉬운 방식으로 변환)
                    -> Render Tree : (웹페이지의 설계도 : HTML + CSS 결과) -> Layout(요소의 배치를 잡는 작업) -> Painting(실제로 화면에 그려내는 과정)
        CSS -> CSSOM

        [Virtual DOM]
        - DOM을 자바스크립트 객체로 흉내낸 것으로 일종의 복제판이다
        - React는 업데이트가 발생하면 실제 DOM을 수정하기 전에 이 가상의 복제판 DOM에 먼저 반영
        - 즉 3개의 이벤트를 가상 DOm에 적용하고 모든 이벤트가 발생했으면 그때 실제 DOM에 3이벤트를 적용
    -->
    
</body>
</html>
